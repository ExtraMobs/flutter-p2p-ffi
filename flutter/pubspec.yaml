name: p2p_ffi_flutter
description: >-
  Android side of p2p_ffi: stops the p2p service when the app goes to the
  background, or keeps it running under an Android foreground service.
version: 0.21.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  p2p_ffi:
    path: ..

flutter:
  plugin:
    platforms:
      android:
        package: dev.extramobs.p2p_ffi_flutter
        pluginClass: P2pFfiFlutterPlugin
        dartPluginClass: P2pFfiFlutter
