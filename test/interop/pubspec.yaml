name: interop_tests
description: Interoperability tests for transpiled_ipfs with Kubo and Helia
publish_to: none

environment:
  sdk: ^3.0.0

dependencies:
  transpiled_ipfs:
    path: ../..
  test: ^1.24.0
  transpiled_quic_go:
    path: ../../packages/transpiled_quic_go
  transpiled_webtransport_go:
    path: ../../packages/transpiled_webtransport_go
  transpiled_multibase:
    path: ../../packages/transpiled_multibase
  transpiled_multihash:
    path: ../../packages/transpiled_multihash
  crypto: ^3.0.7
  boilerplate:
    path: ../../packages/boilerplate
  transpiled_libp2p:
    path: ../../packages/transpiled_libp2p
  transpiled_multiaddr:
    path: ../../packages/transpiled_multiaddr

dependency_overrides:
  xml: ^7.0.1
  dart_udx: ^2.0.3
