name: transpiled_boxo
description: Port of boxo.
version: 0.1.0
homepage: https://github.com/ipfs/boxo
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  boilerplate:
    path: ../boilerplate
  transpiled_go_codec_dagpb:
    path: ../transpiled_go_codec_dagpb
  transpiled_ipld_prime:
    path: ../transpiled_ipld_prime
  base32: ^2.2.0
  transpiled_block_format:
    path: ../transpiled_block_format
  transpiled_cid:
    path: ../transpiled_cid
  transpiled_base58:
    path: ../transpiled_base58
  transpiled_multihash:
    path: ../transpiled_multihash
  transpiled_datastore:
    path: ../transpiled_datastore
  transpiled_varint:
    path: ../transpiled_varint
  transpiled_protobuf:
    path: ../transpiled_protobuf
  transpiled_libp2p:
    path: ../transpiled_libp2p

dev_dependencies:
  test: ^1.28.0
  lints: ^6.1.0
  very_good_analysis: ^10.1.0
  analyzer: ^14.1.0 # AST parsing for tool/generate_module_index.dart
