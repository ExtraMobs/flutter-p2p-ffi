version: 0.1.0
publish_to: none
homepage: https://github.com/libp2p/go-libp2p-kad-dht

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.7
  transpiled_cid:
    path: ../transpiled_cid
  transpiled_libp2p:
