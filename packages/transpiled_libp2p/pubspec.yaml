name: transpiled_libp2p
description: Port of go-libp2p (core/crypto, core/peer, p2p/security/noise).
version: 0.1.0
publish_to: none
homepage: https://github.com/libp2p/go-libp2p

environment:
  sdk: ^3.10.0

dependencies:
  boilerplate:
    path: ../boilerplate
  transpiled_golang_x_time:
    path: ../transpiled_golang_x_time
  transpiled_base32:
    path: ../transpiled_base32
  crypto: ^3.0.7
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  transpiled_datastore:
    path: ../transpiled_datastore
  transpiled_base58:
    path: ../transpiled_base58
  transpiled_cid:
    path: ../transpiled_cid
  transpiled_clock:
    path: ../transpiled_clock
  transpiled_multiaddr:
    path: ../transpiled_multiaddr
  transpiled_multibase:
    path: ../transpiled_multibase
  transpiled_multihash:
    path: ../transpiled_multihash
  transpiled_go_yamux:
    path: ../transpiled_go_yamux
  transpiled_varint:
    path: ../transpiled_varint
  transpiled_crypto_tls:
    path: ../transpiled_crypto_tls
  transpiled_quic_go:
    path: ../transpiled_quic_go
  transpiled_webtransport_go:
    path: ../transpiled_webtransport_go
  transpiled_pion_dtls:
    path: ../transpiled_pion_dtls
  transpiled_pion_ice:
    path: ../transpiled_pion_ice
  transpiled_pion_sctp:
    path: ../transpiled_pion_sctp
  transpiled_pion_datachannel:
    path: ../transpiled_pion_datachannel
  transpiled_pion_stun:
    path: ../transpiled_pion_stun
  transpiled_pion_transport_v4:
    path: ../transpiled_pion_transport_v4
  transpiled_pion_logging:
    path: ../transpiled_pion_logging
  transpiled_pion_sdp:
    path: ../transpiled_pion_sdp

dev_dependencies:
  test: ^1.28.0
  lints: ^6.1.0
  very_good_analysis: ^10.1.0
  analyzer: ^14.1.0 # AST parsing for tool/generate_module_index.dart
