name: p2p_ffi_android
description: App de validação do p2p_ffi no Android (nó IPFS do kubo via dart:ffi).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  p2p_ffi:
    path: ../..
  # o lado Android do pacote: segundo plano (para o serviço ou o mantém num
  # serviço em primeiro plano); registra-se sozinho
  p2p_ffi_flutter:
    path: ../../flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # flutter drive (integration_test em profile/release; test_driver/)
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
