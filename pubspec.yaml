name: p2p_ffi
description: IPFS node (kubo) in a separate process, the p2p_host, with the Go API generated in Dart over shared memory.
publish_to: none
version: 0.20.0

environment:
  sdk: ^3.5.0

dev_dependencies:
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
