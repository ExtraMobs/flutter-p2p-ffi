name: p2p_ffi
description: Peer-to-peer networking from Go (kubo, boxo, go-libp2p) in a separate process, the p2p_host, with the Go API generated in Dart over shared memory.
publish_to: none
version: 0.27.0

environment:
  sdk: ^3.5.0

dev_dependencies:
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
